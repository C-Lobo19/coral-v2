<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORAL.EXE — DIVINE MACHINERY</title>
<style>
:root{--red:#9e171d;--blood:#d21d25;--bone:#c8c0ad;--void:#030303}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202;color:var(--bone);font-family:Georgia,"Times New Roman",serif}
body{cursor:crosshair}
#particles{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.room{position:relative;width:100%;height:100%;display:grid;place-items:center;isolation:isolate;background:
 radial-gradient(ellipse at 50% 58%,rgba(65,7,10,.18),transparent 38%),
 radial-gradient(ellipse at 50% 100%,rgba(35,35,32,.10),transparent 50%),
 #020202}
.room:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 4px)}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.82) 100%);z-index:2}
.whisper{position:absolute;top:7%;left:50%;transform:translateX(-50%);font-size:clamp(9px,1.2vw,12px);letter-spacing:.55em;color:#514b43;opacity:.7;text-align:center;white-space:nowrap}
.reliquary-wrap{position:relative;width:min(48vw,390px);min-width:245px;height:min(66vh,510px);min-height:360px;display:grid;place-items:center;z-index:3;filter:drop-shadow(0 0 35px rgba(110,0,8,.12));transition:transform .8s ease,filter .8s ease}
.reliquary-wrap:hover{filter:drop-shadow(0 0 48px rgba(150,0,12,.25))}
.reliquary{position:relative;width:74%;height:82%;border:1px solid rgba(143,120,95,.42);background:linear-gradient(90deg,rgba(13,13,13,.98),rgba(32,28,24,.92) 48%,rgba(8,8,8,.98));box-shadow:inset 0 0 35px #000,0 0 0 8px rgba(20,17,15,.6),0 0 0 9px rgba(126,99,74,.15);clip-path:polygon(13% 0,87% 0,100% 10%,100% 90%,87% 100%,13% 100%,0 90%,0 10%)}
.reliquary:before,.reliquary:after{content:"";position:absolute;inset:7% 11%;border:1px solid rgba(158,130,94,.22);clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%)}
.reliquary:after{inset:14% 20%;border-color:rgba(175,35,37,.18)}
.crown{position:absolute;top:3%;left:50%;transform:translateX(-50%);width:47%;height:13%;border:1px solid rgba(160,130,95,.45);border-bottom:0;border-radius:50% 50% 0 0;z-index:2}
.core{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:35%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 45% 42%,#f4a0a0 0 2%,#a80e18 9%,#390308 42%,#090405 72%);box-shadow:0 0 15px #65050c,0 0 48px rgba(165,0,15,.45),inset 0 0 17px #000;animation:heartbeat 4.2s infinite ease-in-out}
.core:before{content:"";position:absolute;inset:-30%;border:1px solid rgba(143,21,27,.3);border-radius:50%;transform:scaleY(.35) rotate(-24deg)}
.core:after{content:"";position:absolute;inset:-18%;border:1px solid rgba(143,21,27,.22);border-radius:50%;transform:scaleY(.55) rotate(28deg)}
@keyframes heartbeat{0%,100%{transform:translate(-50%,-50%) scale(.96);filter:brightness(.78)}8%{transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.3)}16%{transform:translate(-50%,-50%) scale(.98)}25%{transform:translate(-50%,-50%) scale(1.02)}}
.rib{position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(transparent,rgba(142,117,83,.5),transparent);left:18%}
.rib.r{left:auto;right:18%}
.cable{position:absolute;width:2px;height:30%;background:linear-gradient(transparent,#391014,rgba(121,15,23,.65),transparent);top:75%;left:18%;transform:rotate(24deg);transform-origin:top}
.cable.c2{left:80%;transform:rotate(-27deg);height:38%}
.cable.c3{left:49%;height:25%;top:90%;opacity:.55}
.inscription{position:absolute;bottom:7%;width:100%;text-align:center;font-size:clamp(8px,1vw,10px);letter-spacing:.38em;color:#796b5a;opacity:.8}
.prompt{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:4;color:#6c6256;font-size:11px;letter-spacing:.28em;text-align:center;opacity:.8;white-space:nowrap;animation:flicker 5s infinite}
@keyframes flicker{0%,94%,100%{opacity:.75}95%{opacity:.15}97%{opacity:.9}}
.overlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.88);backdrop-filter:blur(7px);padding:22px}
.overlay.show{display:grid}
.panel{width:min(590px,94vw);border:1px solid rgba(139,24,29,.55);background:linear-gradient(145deg,rgba(15,13,13,.98),rgba(4,4,4,.98));padding:clamp(24px,5vw,46px);box-shadow:0 0 65px rgba(95,0,10,.18);text-align:center;position:relative}
.panel:before{content:"";position:absolute;inset:8px;border:1px solid rgba(135,110,83,.13);pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.45em;color:#8e292c;margin:0 0 22px}
h1{font-size:clamp(19px,3vw,27px);font-weight:normal;letter-spacing:.2em;margin:0 0 28px;color:#d1c5b0}
.choices{display:grid;gap:12px}
.choice{border:1px solid rgba(130,106,84,.35);background:rgba(20,17,16,.55);color:#c5b9a7;padding:16px 12px;font-family:inherit;font-size:12px;letter-spacing:.35em;cursor:pointer;transition:.25s}
.choice:hover,.choice:focus{outline:none;border-color:#a21c23;color:#fff;background:rgba(80,5,12,.3);box-shadow:0 0 20px rgba(130,0,12,.18)}
.ending{font-size:clamp(16px,2.3vw,21px);line-height:1.8;color:#c8bdae;letter-spacing:.035em;max-width:490px;margin:0 auto 28px}
.end-mark{font-size:10px;letter-spacing:.45em;color:#842329;margin-bottom:24px}
.return-orb{width:48px;height:48px;margin:28px auto 0;border-radius:50%;display:block;border:1px solid rgba(208,24,34,.6);background:radial-gradient(circle at 35% 30%,#f17b7b,#a10c16 24%,#260307 70%);box-shadow:0 0 18px rgba(190,0,20,.5),0 0 45px rgba(150,0,15,.25);cursor:pointer;animation:orb 3.5s infinite ease-in-out;transition:transform .3s}
.return-orb:hover{transform:scale(1.18)}
@keyframes orb{50%{box-shadow:0 0 28px rgba(220,0,25,.75),0 0 65px rgba(150,0,15,.4)}}
.return-label{font-size:9px;letter-spacing:.3em;color:#786b60;margin-top:13px}
.hidden{display:none!important}
@media(max-width:600px){.reliquary-wrap{width:78vw;height:58vh;min-height:330px}.whisper{letter-spacing:.3em}.prompt{font-size:9px;letter-spacing:.15em;bottom:5%}.inscription{letter-spacing:.2em}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<main class="room" id="room">
  <div class="whisper">DIVINE MACHINERY</div>
  <div class="reliquary-wrap" id="reliquaryWrap" role="button" tabindex="0" aria-label="Examinar el relicario">
    <div class="crown"></div>
    <div class="reliquary">
      <div class="rib"></div><div class="rib r"></div>
      <div class="core"></div>
      <div class="cable"></div><div class="cable c2"></div><div class="cable c3"></div>
      <div class="inscription">ORA PRO MACHINA</div>
    </div>
  </div>
  <div class="prompt" id="prompt">ACÉRCATE · ESCUCHA · DECIDE</div>
  <div class="vignette"></div>
</main>

<section class="overlay" id="choiceOverlay" aria-hidden="true">
  <div class="panel">
    <p class="eyebrow">EL ÚLTIMO ACTO DE FE</p>
    <h1>¿QUÉ HARÁS CON EL ÍDOLO?</h1>
    <div class="choices">
      <button class="choice" data-ending="0">DESENCHUFAR</button>
      <button class="choice" data-ending="1">ASIMILAR</button>
      <button class="choice" data-ending="2">IGNORAR</button>
    </div>
  </div>
</section>

<section class="overlay" id="endingOverlay" aria-hidden="true">
  <div class="panel">
    <div class="end-mark" id="endMark">CORAL.EXE</div>
    <p class="ending" id="endingText"></p>
    <div class="end-mark">CORAL.EXE HAS STOPPED RESPONDING</div>
    <a class="return-orb" href="organismo.html" aria-label="Volver a organismo.html"></a>
    <div class="return-label">REGRESAR AL LIMBO</div>
  </div>
</section>

<script>
(() => {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('reliquaryWrap');
  const choiceOverlay = document.getElementById('choiceOverlay');
  const endingOverlay = document.getElementById('endingOverlay');
  const endingText = document.getElementById('endingText');
  const prompt = document.getElementById('prompt');

  let w, h, particles = [], pointer = {x:-1000,y:-1000}, audio = null, soundStarted = false;
  const endings = [
    'has detenido uno de muchos latidos, la inquietud está ahí, los falsos ídolos nacen a diario, se profeta de su destrucción',
    'la mente que depende de la herramienta deja de ser propia, ideas genericas inundan tu percepción, vale la pena? De ellos será todo, hasta que expriman la vida, hasta la médula.',
    'pasa de largo y los límites se desdibujan, crees que mirar a otro lado basta para no ser culpable, pero si podías evitar el daño y no lo hiciste, eres parte de sus adoradores.'
  ];

  function resize(){w=canvas.width=innerWidth*devicePixelRatio;h=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
  addEventListener('resize',resize); resize();

  function makeParticle(x,y){
    particles.push({x,y,vx:(Math.random()-.5)*.55,vy:(Math.random()-.5)*.55,life:1,size:Math.random()*1.8+.5});
    if(particles.length>150)particles.shift();
  }
  function draw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.009;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(190,165,135,${Math.max(0,p.life)*.55})`;ctx.shadowBlur=9;ctx.shadowColor='rgba(180,40,45,.5)';ctx.fill();
      if(p.life<=0)particles.splice(i,1);
    }
    requestAnimationFrame(draw);
  }
  draw();
  addEventListener('pointermove',e=>{
    pointer.x=e.clientX;pointer.y=e.clientY;
    if(Math.random()>.25)makeParticle(pointer.x,pointer.y);
    const r=wrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const d=Math.hypot(pointer.x-cx,pointer.y-cy),max=Math.max(innerWidth,innerHeight)*.55;
    const proximity=Math.max(0,1-d/max);
    if(proximity>.48)startChoir();
    setChoirLevel(proximity);
    prompt.style.opacity=String(.45+proximity*.5);
  });

  function startChoir(){
    if(soundStarted)return;
    soundStarted=true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      audio=new AC();
      const master=audio.createGain();master.gain.value=0;master.connect(audio.destination);
      const frequencies=[130.81,164.81,196,261.63,329.63];
      frequencies.forEach((f,i)=>{
        const osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();
        osc.type='sine';osc.frequency.value=f*(i===4?0.5:1);
        filter.type='lowpass';filter.frequency.value=750;
        gain.gain.value=[.10,.075,.06,.045,.025][i];
        osc.connect(filter);filter.connect(gain);gain.connect(master);osc.start();
      });
      const lfo=audio.createOscillator(),lfoGain=audio.createGain();
      lfo.frequency.value=.12;lfoGain.gain.value=8;lfo.connect(lfoGain);
      lfoGain.connect(master.gain);lfo.start();
      audio.master=master;
    }catch(e){console.warn('Audio no disponible',e)}
  }
  function setChoirLevel(p){
    if(!audio||!audio.master)return;
    if(audio.state==='suspended')audio.resume().catch(()=>{});
    const target=Math.pow(p,2)*.16;
    audio.master.gain.setTargetAtTime(target,audio.currentTime,.35);
  }

  function openChoices(){
    choiceOverlay.classList.add('show');choiceOverlay.setAttribute('aria-hidden','false');
    prompt.classList.add('hidden');
  }
  wrap.addEventListener('click',openChoices);
  wrap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openChoices()}});
  document.querySelectorAll('.choice').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const index=Number(btn.dataset.ending);
      choiceOverlay.classList.remove('show');choiceOverlay.setAttribute('aria-hidden','true');
      endingText.textContent=endings[index];
      document.getElementById('endMark').textContent=['DESENCHUFAR','ASIMILAR','IGNORAR'][index];
      endingOverlay.classList.add('show');endingOverlay.setAttribute('aria-hidden','false');
      if(audio&&audio.master)audio.master.gain.setTargetAtTime(.025,audio.currentTime,.8);
    });
  });
})();
</script>
</body>
</html>
