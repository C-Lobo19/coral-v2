<style>
:root{--bg:#030504;--moss:#17251b;--red:#c01425;--text:#a6aa98}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100vh;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(ellipse at 50% 45%,#1b281c 0,transparent 48%),#030504;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,transparent 0 3px,#0008 4px 5px);opacity:.35}
main{min-height:100vh;padding:22px 14px 28px;display:flex;align-items:center;flex-direction:column}
.top{width:min(960px,100%);display:flex;justify-content:space-between;font:10px monospace;letter-spacing:.18em;color:#596653}
h1{font-size:clamp(18px,3vw,28px);font-weight:normal;letter-spacing:.4em;margin:27px 0 8px;text-align:center}
.sub{font:10px monospace;letter-spacing:.18em;text-align:center;color:#65705e}
.scene{position:relative;width:min(680px,96vw);height:clamp(440px,65vh,600px);margin:8px auto 0}
.figure{position:absolute;width:100%;height:100%;inset:0;filter:drop-shadow(0 0 15px #27090d)}
.vein{fill:none;stroke:#34432f;stroke-width:2.5;stroke-linecap:round}
.redvein{fill:none;stroke:#65121b;stroke-width:3}
.screen{position:absolute;width:clamp(82px,17vw,120px);height:clamp(62px,12vw,86px);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;background:#030604ed;border:1px solid #4a5544;color:#b0b39e;text-decoration:none;font:10px/1.5 monospace;letter-spacing:.08em;text-transform:uppercase;z-index:2;box-shadow:inset 0 0 15px #172319,0 0 15px #000;transition:.2s}
.screen:hover,.screen:focus-visible{outline:0;border-color:#c01425;color:#f1c2c3;background:#180609;box-shadow:0 0 20px #790b17;transform:scale(1.05)}.screen.locked{opacity:.38;filter:grayscale(1);cursor:not-allowed;pointer-events:none;box-shadow:inset 0 0 15px #101510,0 0 8px #000}
.s1{left:19%;top:25%}.s2{right:19%;top:25%}.s3{left:19%;top:49%}.s4{right:19%;top:49%}
.face{position:absolute;z-index:3;left:50%;top:7%;transform:translateX(-50%);width:76px;height:76px;border:1px solid transparent;border-radius:50%;background:transparent;cursor:pointer}
.face:hover,.face:focus-visible{outline:1px dotted #c01425;background:#650b171c}
.hint{font:10px/1.7 monospace;text-align:center;letter-spacing:.1em;color:#586251;margin-top:-5px}
.foot{margin-top:auto;padding-top:22px;text-align:center;font:9px monospace;letter-spacing:.15em;color:#394536}
.message{position:fixed;z-index:10;top:50%;left:50%;width:90vw;transform:translate(-50%,-50%);text-align:center;color:#ed182c;font:bold clamp(19px,4.5vw,40px)/1.25 monospace;text-transform:uppercase;text-shadow:3px 0 #39000a,-3px 0 #ff263e,0 0 18px #d00020;opacity:0;pointer-events:none}
.message.show{opacity:1;animation:glitch .13s steps(2) infinite}
@keyframes glitch{0%{transform:translate(-50%,-50%);clip-path:inset(0)}25%{transform:translate(calc(-50% + 4px),calc(-50% - 2px));clip-path:inset(20% 0 45%)}50%{transform:translate(calc(-50% - 3px),-50%);clip-path:inset(55% 0 12%)}75%{transform:translate(-50%,calc(-50% + 2px));clip-path:inset(0)}}
body.panic{animation:panic .16s steps(2) 8}
@keyframes panic{25%{filter:contrast(2) hue-rotate(80deg);transform:translateX(4px)}50%{filter:invert(.18);transform:translateX(-4px)}75%{filter:contrast(2);transform:translateY(2px)}}
@media(max-width:430px){.s1,.s3{left:7%}.s2,.s4{right:7%}.scene{height:480px}.screen{width:100px}}
</style>
</head>

<script>
(() => {
const face=document.getElementById('face'), message=document.getElementById('message');
let ctx;
function scream(){
const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume();
const t=ctx.currentTime,g=ctx.createGain(),o=ctx.createOscillator(),lfo=ctx.createOscillator(),lg=ctx.createGain();
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+2.1);g.connect(ctx.destination);
o.type='sawtooth';o.frequency.setValueAtTime(720,t);o.frequency.exponentialRampToValueAtTime(155,t+1.8);
lfo.type='sine';lfo.frequency.value=17;lg.gain.value=110;lfo.connect(lg);lg.connect(o.frequency);o.connect(g);o.start(t);lfo.start(t);o.stop(t+2.15);lfo.stop(t+2.15);
}
face.addEventListener('click',()=>{scream();message.classList.add('show');document.body.classList.remove('panic');void document.body.offsetWidth;document.body.classList.add('panic');setTimeout(()=>document.body.classList.remove('panic'),1500);setTimeout(()=>message.classList.remove('show'),4500)});
})();
</script>
